name: Apply bilingual and image updates
on:
  push:
    paths: ['.github/workflows/bilingual-update.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify and apply update
        shell: python
        run: |
          import base64, hashlib, io, json, zipfile
          from pathlib import Path
          raw = base64.b64decode(Path("bilingual-update.b64").read_bytes())
          assert hashlib.sha256(raw).hexdigest() == "e696ad6d0bd6054f714aba71ec746d4231911b775561d2d0c4309a31c061e9e3"
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              expected = json.loads(z.read("update-manifest.json"))
              for name, previous in expected.items():
                  p = Path(name)
                  assert not p.is_absolute() and ".." not in p.parts
                  if previous is None:
                      assert not p.exists(), f"New path already exists: {name}"
                  else:
                      data = p.read_bytes()
                      actual = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
                      assert actual == previous, f"Concurrent edit detected: {name}"
              for name in expected:
                  p = Path(name)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_bytes(z.read(name))
      - name: Save updated source
        run: |
          git rm bilingual-update.b64
          git add README.md VALIDATION.md content data layouts static
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Align Japanese and English pages and normalize image sizing"
          git push origin HEAD:main
