name: Deploy Hugo site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        id: pages
      - name: Install Hugo
        env:
          HUGO_VERSION: '0.168.0'
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/hugo_${HUGO_VERSION}_linux-amd64.tar.gz" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/checksums.txt" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_checksums.txt"
          cd "$RUNNER_TEMP"
          grep " hugo_${HUGO_VERSION}_linux-amd64.tar.gz$" checksums.txt | sha256sum --check
          tar -xzf "hugo_${HUGO_VERSION}_linux-amd64.tar.gz" hugo
      - name: Build
        run: '"$RUNNER_TEMP/hugo" --minify --baseURL "${{ steps.pages.outputs.base_url }}/"'
      - name: Check local links
        run: python3 scripts/check_site.py public
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
